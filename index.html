(function(){'use strict';

const pct=(x,y)=>y?Math.round(100*x/y)+'%':'0%';

ion budget" id="budget"><div class="wrap">${ph('Budget allocations')}<span class="kicker">Transparent working budget</span><h2>What we produce. What we source.</h2><p class="lede">Our pre-production, shooting, equipment, photography, editing and delivery services are presented separately from talent, styling, licenses and other third-party expenses. These are budget allocations, not confirmed supplier quotations.</p>${allocations}<div class="callout"><strong>Booking walkthrough — in-scope editorial provision, pending treatment approval</strong><p>${esc(c.booking)}</p><div class="bookinggrid">${m.plans.map(p=>`<div class="book"><span class="tag">ESTIMATE ${p.code}</span><strong>${money(p.bookingValue)}</strong><small>${p.bookingHours} editorial hours, already included in Editing & Finishing. Not added to ${money(p.total)}.</small></div>`).join('')}</div></div><div class="callout"><strong>Rights and distribution</strong><p>${esc(c.rights)}</p></div></div></section><section class="section" id="next">${ph('Next steps')}<span class="kicker">Planning milestones</span><h2>A workable path to 2027.</h2><div class="timeline">${c.roadmap.map((x,i)=>`<div class="phase"><small>0${i+1} / ${esc(x.title)}</small><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></div>`).join('')}</div><div class="callout"><strong>Next meeting (proposed)</strong><p>${esc(c.next)}</p></div></section><footer class="footer"><strong>${esc(m.meta.studio)} · ${esc(m.meta.client)}</strong><p class="fine">${esc(c.notes)}</p></footer></div>`;
